[package]
name = "tauri-plugin-android-updater"
version = "0.1.0"
description = "In-app APK download and system installer invocation for Android (Tauri v2)"
authors = ["personal"]
edition = "2021"
license = "MIT"
links = "tauri-plugin-android-updater"
build = "build.rs"
publish = false

[lib]
name = "tauri_plugin_android_updater"
path = "src/lib.rs"

[dependencies]
tauri = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
